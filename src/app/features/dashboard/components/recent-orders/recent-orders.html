<div class="card">

    <h3>Pedidos recientes</h3>

    <table>

        <thead>
            <tr>
                <th>#</th>
                <th>Cliente</th>
                <th>Estado</th>
                <th>Total</th>
            </tr>
        </thead>

        <tbody>

            @for(order of orders; track order.id){

            <tr>

                <td>{{ order.id }}</td>

                <td>{{ order.customer?.name }}</td>

                <td>
                    <span class="status">
                        {{ order.status }}
                    </span>
                </td>

                <td>
                    {{ order.total | currency:'COP':'symbol':'1.0-0' }}
                </td>

            </tr>

            }

        </tbody>

    </table>

</div>
