<div class="stats-grid">

  @for (card of cards; track card.title) {

    <div class="stat-card" [class]="card.color">

      <div>
        <span class="title">{{ card.title }}</span>
        <h2>{{ card.value }}</h2>
      </div>

      <div class="icon">
        <i class="bi" [class]="card.icon"></i>
      </div>

    </div>

  }

</div>
