<div class="form-card">

  <h2>Nuevo Producto</h2>

  <form
    [formGroup]="productForm"
    (ngSubmit)="save()">

    <div class="form-group">

      <label>Nombre</label>

      <input
        type="text"
        class="form-control"
        formControlName="name">

    </div>

    <div class="form-group">

      <label>Descripción</label>

      <textarea
        rows="3"
        class="form-control"
        formControlName="description">
      </textarea>

    </div>

    <div class="grid">

      <div class="form-group">

        <label>Precio</label>

        <input
          type="number"
          class="form-control"
          formControlName="price">

      </div>

      <div class="form-group">

        <label>Stock</label>

        <input
          type="number"
          class="form-control"
          formControlName="stock">

      </div>

    </div>

    <div class="form-group">

      <label>Categoría</label>

      <select
        class="form-control"
        formControlName="categoryId">

        <option [ngValue]="null">

          Seleccione...

        </option>

        <option [value]="1">

          Computadores

        </option>

        <option [value]="2">

          Celulares

        </option>

      </select>

    </div>

    <div class="form-group">

      <label>Imagen del producto</label>

      <input
        type="file"
        class="form-control"
        accept="image/*"
        (change)="onFileSelected($event)">

    </div>

    @if(previewImage){

      <div class="preview">

        <img
          [src]="previewImage"
          alt="Vista previa">

      </div>

    }

    <div class="form-check mt-4">

      <input
        class="form-check-input"
        type="checkbox"
        formControlName="isActive">

      <label class="form-check-label">

        Producto Activo

      </label>

    </div>

    <div class="buttons">

      <button
        type="submit"
        class="btn-primary">

        Guardar Producto

      </button>

    </div>

  </form>

</div>
