<div style="position: relative; max-width: 580px; margin: 0 auto;">

    <div class="card shadow-sm border-0" style="border-radius:10px;">

        <div class="card-header bg-white border-bottom py-2 d-flex align-items-center px-3"
             style="border-radius:10px 10px 0 0;">

            <i class="bi bi-person text-primary me-2" style="font-size: 0.85rem;"></i>
            <span class="fw-semibold" style="font-size: 0.85rem;">Cliente</span>

        </div>

        <div class="card-body p-2">

            <div class="input-group">

                <span class="input-group-text bg-white" style="border-radius:6px 0 0 6px;">
                    <i class="bi bi-person" style="font-size:0.75rem;"></i>
                </span>

                <select
                    class="form-select form-select-sm"
                    style="font-size:0.82rem;"
                    [(ngModel)]="selectedCustomer"
                    (ngModelChange)="selectCustomer($event)">

                    <option [ngValue]="null">
                        Seleccione un cliente
                    </option>

                    <option
                        *ngFor="let customer of customers"
                        [ngValue]="customer">

                        {{ customer.name }} - {{ customer.phone }}

                    </option>

                </select>

                <button
                    class="btn btn-success btn-sm"
                    type="button"
                    style="border-radius:0 6px 6px 0; font-size:0.82rem;"
                    (click)="createCustomer()">

                    <i class="bi bi-plus-circle me-1"></i>
                    Nuevo

                </button>

            </div>

        </div>

    </div>

</div>
