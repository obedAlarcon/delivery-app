<div class="card-body p-0 bg-white">

    <div *ngIf="items.length===0"
         class="text-center py-5">

        <i class="bi bi-cart-x display-5 text-secondary"></i>

        <h5 class="mt-3 fw-semibold">
            No hay productos agregados
        </h5>

        <p class="text-muted mb-0">
            Selecciona productos del catálogo
        </p>

    </div>

    <table
        *ngIf="items.length>0"
        class="table table-hover align-middle mb-0">

        <tbody>

            <tr *ngFor="let item of items">

                <!-- eliminar -->

                <td width="55" class="text-center">

                    <button
                        class="btn btn-sm btn-light border text-danger"
                        (click)="removeItem.emit(item)">

                        <i class="bi bi-trash"></i>

                    </button>

                </td>

                <!-- producto -->

                <td>




                    <div class="fw-semibold">
                       {{ item.product?.name }}
                          
                    </div>

                    <small class="text-muted">

                        {{ item.price | currency:'COP':'symbol':'1.0-0' }}

                    </small>

                </td>

                <!-- cantidad -->

                <td width="110">

                    <input
                        type="number"
                        min="1"
                        class="form-control form-control-sm text-center"
                        [(ngModel)]="item.quantity"
                        (change)="quantityChanged(item)">

                </td>

                <!-- subtotal -->

                <td
                    width="140"
                    class="text-end">

                    <strong class="text-success">

                        {{ item.quantity * item.price | currency:'COP':'symbol':'1.0-0' }}

                    </strong>

                </td>

            </tr>

        </tbody>

    </table>

</div>
