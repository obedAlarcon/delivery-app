<div class="container-fluid px-3">

    <!-- =====================================================
         PARTE SUPERIOR
         ===================================================== -->

    <div class="row g-3 order-top-row">

        <!-- =================================================
             IZQUIERDA
             CLIENTE + PRODUCTOS EN UNA SOLA CARD
             ================================================= -->

        <div class="col-lg-6">

            <div class="order-left-card">

                <!-- CLIENTE -->

                <app-customer-card
                    class="customer-component"
                    (customerSelected)="onCustomerSelected($event)">
                </app-customer-card>


                <!-- PRODUCTOS DEL PEDIDO -->

                <div class="order-products-inside">

                    <app-order-products
                        class="order-products-component"
                        [items]="items"
                        (increaseItem)="increase($event)"
                        (decreaseItem)="decrease($event)"
                        (removeItem)="remove($event)">
                    </app-order-products>

                </div>

            </div>

        </div>


        <!-- =================================================
             DERECHA
             CATÁLOGO
             ================================================= -->

        <div class="col-lg-6">

            <div class="catalog-wrapper">

                <app-product-catalog
                    class="catalog-component"
                    (addProduct)="addProduct($event)">
                </app-product-catalog>

            </div>

        </div>

    </div>


    <!-- =====================================================
         ESPACIO
         ===================================================== -->

    <div class="main-space"></div>


    <!-- =====================================================
         TOTAL DEL PEDIDO
         ===================================================== -->

    <div class="card shadow-sm border-0 order-total-card">

        <div class="card-body">

            <div class="order-total-content">

                <div class="order-total-info">

                    <div class="order-total-label">
                        Total del pedido
                    </div>

                    <div class="order-total-value">
                        {{ total | currency:'COP':'symbol':'1.0-0' }}
                    </div>

                </div>


                <button
                    type="button"
                    class="btn btn-success btn-save-order"
                    (click)="saveOrder()">

                    <i class="bi bi-check-circle me-2"></i>

                    Guardar pedido

                </button>

            </div>

        </div>

    </div>


    <div class="payment-space"></div>


    <!-- =====================================================
         ESTADOS
         ===================================================== -->

    <div class="row g-3 mb-4">

        <div class="col-md-4">

            <label class="form-label">
                Método de pago
            </label>

            <select
                class="form-select"
                [(ngModel)]="paymentMethod">

                <option>Efectivo</option>
                <option>Nequi</option>
                <option>Transferencia</option>
                <option>Tarjeta débito</option>
                <option>Tarjeta crédito</option>

            </select>

        </div>


        <div class="col-md-4">

            <label class="form-label">
                Estado del pago
            </label>

            <select
                class="form-select"
                [(ngModel)]="paymentStatus">

                <option>Pendiente</option>
                <option>Pagado</option>
                <option>Cancelado</option>

            </select>

        </div>


        <div class="col-md-4">

            <label class="form-label">
                Estado de la orden
            </label>

            <select
                class="form-select"
                [(ngModel)]="orderStatus">

                <option>Pendiente</option>
                <option>En proceso</option>
                <option>Entregado</option>
                <option>Cancelado</option>

            </select>

        </div>

    </div>

</div>
